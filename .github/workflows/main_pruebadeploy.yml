# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - pruebadeploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_50FEBC9027EC4443AFD224695513F9CF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2CD53B0B61E94CFBB86221C4057CEDC3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A9962E5A2A3E4B7AB319B2CA4A859F2D }}

      - name: Configure Laravel public directory
        uses: azure/cli@v2
        with:
          inlineScript: |
            RESOURCE_GROUP=$(az webapp list --query "[?name=='pruebadeploy'].resourceGroup | [0]" -o tsv)
            az webapp config set \
              --resource-group "$RESOURCE_GROUP" \
              --name "pruebadeploy" \
              --startup-file "mkdir -p /home/site/wwwroot/storage/framework/cache /home/site/wwwroot/storage/framework/sessions /home/site/wwwroot/storage/framework/views /home/site/wwwroot/storage/logs && chmod -R 775 /home/site/wwwroot/storage /home/site/wwwroot/bootstrap/cache && cd /home/site/wwwroot && php artisan optimize:clear || true && cp /home/site/wwwroot/default /etc/nginx/sites-available/default && service nginx reload"

      - name: Configure Laravel app settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            RESOURCE_GROUP=$(az webapp list --query "[?name=='pruebadeploy'].resourceGroup | [0]" -o tsv)
            az webapp config appsettings set \
              --resource-group "$RESOURCE_GROUP" \
              --name "pruebadeploy" \
              --settings \
                APP_ENV=production \
                APP_DEBUG=false \
                DB_CONNECTION=sqlsrv \
                DB_HOST=svr-sql-ctezo.southcentralus.cloudapp.azure.com \
                DB_PORT=1433 \
                DB_DATABASE=db_WebDevUMG \
                DB_USERNAME=UsuarioEncuestas \
                DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
                DB_ENCRYPT=yes \
                DB_TRUST_SERVER_CERTIFICATE=true

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'pruebadeploy'
          slot-name: 'Production'
          package: .
          
